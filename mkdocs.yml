site_name: A8 | Data to working AI
site_description: Notebook-first Databricks learning, from governed data to working AI.
theme:
  name: material
  font: false
  logo: assets/a8-logo.png
  favicon: assets/a8-logo.png
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
extra_css:
  - stylesheets/a8.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Course overview: index.md
  - Git folders for beginners: git-folders.md
  - Notebook code standard: code-standard.md
  - Design rationale: design-rationale.md
  - Validation evidence: validation.md
  - Known issues: issues.md
  - Brand application: brand.md
